<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>File Scanner</title>

<meta name="theme-color" content="#08090d">

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- QR Code -->
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

    background:
    radial-gradient(circle at top left,#172033 0%,transparent 35%),
    radial-gradient(circle at bottom right,#18251f 0%,transparent 35%),
    #08090d;

    color:#fff;
    min-height:100vh;
    padding:25px 15px;
}

.container{
    width:100%;
    max-width:720px;
    margin:auto;
}

/* HEADER */

.header{
    text-align:center;
    margin-bottom:25px;
}

.logo{
    width:70px;
    height:70px;
    margin:auto;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:22px;

    background:
    linear-gradient(135deg,#ffffff,#c9d0ff);

    color:#111;

    font-size:34px;

    box-shadow:
    0 15px 50px rgba(100,120,255,.25);
}

h1{
    font-size:32px;
    margin-top:18px;
    letter-spacing:-1px;
}

.subtitle{
    margin-top:8px;
    color:#9ca3af;
    font-size:15px;
}

/* CARD */

.card{
    background:
    rgba(255,255,255,.055);

    border:1px solid rgba(255,255,255,.09);

    backdrop-filter:blur(20px);

    border-radius:28px;

    padding:25px;

    box-shadow:
    0 25px 80px rgba(0,0,0,.35);
}

/* BANNER */

.banner{
    border-radius:20px;
    overflow:hidden;
    margin-bottom:22px;

    background:
    linear-gradient(135deg,#283593,#5c6bc0);

    min-height:145px;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    position:relative;
}

.banner img{
    width:100%;
    height:100%;
    min-height:145px;
    object-fit:cover;
}

.banner-content{
    padding:25px;
}

.banner-icon{
    font-size:40px;
}

.banner-title{
    font-size:25px;
    font-weight:800;
    margin-top:8px;
}

.banner-text{
    color:#e5e7eb;
    margin-top:5px;
}

/* FILE INPUT */

.file-area{
    border:2px dashed #444b5c;

    border-radius:20px;

    padding:28px 15px;

    text-align:center;

    transition:.2s;

    cursor:pointer;
}

.file-area:hover{
    border-color:#fff;
    background:rgba(255,255,255,.03);
}

.file-icon{
    font-size:40px;
    margin-bottom:10px;
}

.file-title{
    font-size:17px;
    font-weight:700;
}

.file-sub{
    color:#8d94a5;
    font-size:13px;
    margin-top:5px;
}

input[type=file]{
    display:none;
}

/* BUTTON */

.main-button{
    width:100%;

    border:none;

    margin-top:18px;

    padding:17px;

    border-radius:16px;

    background:#fff;

    color:#08090d;

    font-size:16px;

    font-weight:800;

    cursor:pointer;

    transition:.2s;
}

.main-button:hover{
    transform:translateY(-2px);

    box-shadow:
    0 10px 35px rgba(255,255,255,.15);
}

.main-button:disabled{
    opacity:.5;
}

/* CUSTOM BANNER */

.custom-section{
    margin-top:22px;

    padding-top:20px;

    border-top:1px solid rgba(255,255,255,.08);
}

.section-title{
    font-size:14px;
    font-weight:700;
    margin-bottom:12px;
}

.banner-options{
    display:grid;
    grid-template-columns:
    repeat(4,1fr);

    gap:8px;
}

.banner-option{
    padding:12px 5px;

    border-radius:13px;

    border:1px solid #343947;

    background:#11141c;

    color:#ddd;

    cursor:pointer;

    text-align:center;

    font-size:12px;
}

.banner-option:hover{
    border-color:#fff;
}

.url-input{
    width:100%;

    margin-top:12px;

    padding:13px;

    border-radius:12px;

    border:1px solid #343947;

    background:#11141c;

    color:white;

    outline:none;
}

.url-input:focus{
    border-color:#fff;
}

/* STATUS */

.status{
    text-align:center;

    margin-top:18px;

    color:#aeb5c5;

    font-size:14px;
}

/* RESULT */

.result{
    display:none;

    margin-top:25px;

    text-align:center;

    animation:fade .4s ease;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(10px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.success{
    font-size:18px;
    font-weight:800;
}

.file-name{
    color:#9ca3af;

    font-size:13px;

    margin-top:5px;

    word-break:break-word;
}

.qr-wrapper{
    background:white;

    width:250px;
    height:250px;

    margin:22px auto;

    padding:15px;

    border-radius:20px;

    display:flex;
    justify-content:center;
    align-items:center;
}

#qrcode img{
    max-width:220px;
}

/* ACTIONS */

.actions{
    display:grid;

    grid-template-columns:
    1fr 1fr;

    gap:10px;
}

.action{
    border:none;

    padding:14px;

    border-radius:14px;

    background:#191d27;

    color:white;

    font-weight:700;

    cursor:pointer;

    border:1px solid #2b3040;
}

.action:hover{
    background:#252a36;
}

.open{
    grid-column:1/-1;

    background:#fff;

    color:#000;
}

/* LINK */

.link-box{
    margin-top:15px;

    display:flex;

    gap:7px;
}

.link-box input{
    flex:1;

    min-width:0;

    background:#10131a;

    border:1px solid #2b3040;

    color:#aaa;

    padding:11px;

    border-radius:10px;

    font-size:12px;
}

.link-box button{
    border:none;

    border-radius:10px;

    padding:0 15px;

    background:#272c38;

    color:white;

    cursor:pointer;
}

/* FOOTER */

.footer{
    text-align:center;

    color:#606778;

    font-size:12px;

    margin-top:22px;
}

/* MOBILE */

@media(max-width:500px){

    body{
        padding:15px 10px;
    }

    .card{
        padding:18px;
        border-radius:22px;
    }

    h1{
        font-size:28px;
    }

    .banner-options{
        grid-template-columns:
        repeat(2,1fr);
    }

}

</style>
</head>


<body>

<div class="container">

    <header class="header">

        <div class="logo">
            📁
        </div>

        <h1>
            File Scanner
        </h1>

        <p class="subtitle">
            Upload anything. Generate a QR.
            Share instantly.
        </p>

    </header>


    <main class="card">


        <!-- BANNER -->

        <div class="banner" id="banner">

            <div class="banner-content">

                <div class="banner-icon"
                     id="bannerIcon">
                    📡
                </div>

                <div class="banner-title"
                     id="bannerTitle">
                    Scan & Connect
                </div>

                <div class="banner-text"
                     id="bannerText">
                    One scan. Instant access.
                </div>

            </div>

        </div>


        <!-- FILE SELECT -->

        <label class="file-area"
               for="fileInput">

            <div class="file-icon">
                📤
            </div>

            <div class="file-title"
                 id="fileTitle">

                Choose your file

            </div>

            <div class="file-sub">

                Photo • PDF • Video • Document • Anything

            </div>

        </label>

        <input
            type="file"
            id="fileInput"
        >


        <button
            class="main-button"
            id="uploadButton"
            onclick="uploadFile()">

            Upload & Generate QR

        </button>


        <div
            class="status"
            id="status">

        </div>


        <!-- CUSTOM BANNER -->

        <div class="custom-section">

            <div class="section-title">
                🎨 Scanner Header
            </div>

            <div class="banner-options">

                <button
                    class="banner-option"
                    onclick="setBanner('wifi')">

                    📶<br>
                    Free Wi-Fi

                </button>

                <button
                    class="banner-option"
                    onclick="setBanner('menu')">

                    🍽️<br>
                    Menu

                </button>

                <button
                    class="banner-option"
                    onclick="setBanner('offer')">

                    🎁<br>
                    Offer

                </button>

                <button
                    class="banner-option"
                    onclick="setBanner('event')">

                    🎟️<br>
                    Event

                </button>

            </div>


            <input
                class="url-input"
                id="customImage"
                placeholder="Paste custom image URL (optional)"
            >

            <button
                class="action"
                style="width:100%;margin-top:10px"
                onclick="setCustomImage()">

                🖼️ Use Custom Image

            </button>

        </div>


        <!-- RESULT -->

        <div
            class="result"
            id="result">

            <div class="success">
                ✓ QR Created
            </div>

            <div
                class="file-name"
                id="resultFileName">
            </div>


            <div class="qr-wrapper">

                <div id="qrcode"></div>

            </div>


            <div class="actions">

                <button
                    class="action open"
                    onclick="openFile()">

                    📂 Open File

                </button>


                <button
                    class="action"
                    onclick="shareScanner()">

                    📤 Share Scanner

                </button>


                <button
                    class="action"
                    onclick="copyLink()">

                    🔗 Copy Link

                </button>


                <button
                    class="action"
                    onclick="downloadQR()">

                    ⬇️ Download QR

                </button>

            </div>


            <div class="link-box">

                <input
                    id="fileLink"
                    readonly
                >

            </div>

        </div>

    </main>


    <div class="footer">

        File Scanner • Fast • Simple • Shareable

    </div>

</div>



<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://ljyuhpgwjlgcbpgnmdui.supabase.co";

const SUPABASE_KEY =
"sb_publishable_RH86rGQggXgBJ_rokiypdA_8q4UGyk3";


const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   VARIABLES
===================================================== */

let currentFileURL = "";

let currentBanner =
{
    icon:"📡",
    title:"Scan & Connect",
    text:"One scan. Instant access."
};


/* =====================================================
   FILE SELECT
===================================================== */

document
.getElementById("fileInput")
.addEventListener("change",function(){

    const file=this.files[0];

    if(!file)return;

    document
    .getElementById("fileTitle")
    .innerText=file.name;

});


/* =====================================================
   BANNER
===================================================== */

function setBanner(type){

    const banner =
    document.getElementById("banner");

    const icon =
    document.getElementById("bannerIcon");

    const title =
    document.getElementById("bannerTitle");

    const text =
    document.getElementById("bannerText");


    if(type==="wifi"){

        currentBanner={
            icon:"📶",
            title:"Free Wi-Fi",
            text:"Scan to connect instantly."
        };

        banner.style.background=
        "linear-gradient(135deg,#00695c,#26a69a)";
    }


    if(type==="menu"){

        currentBanner={
            icon:"🍽️",
            title:"Digital Menu",
            text:"Scan to view our menu."
        };

        banner.style.background=
        "linear-gradient(135deg,#6a1b9a,#ab47bc)";
    }


    if(type==="offer"){

        currentBanner={
            icon:"🎁",
            title:"Special Offer",
            text:"Scan to unlock this offer."
        };

        banner.style.background=
        "linear-gradient(135deg,#c62828,#ef5350)";
    }


    if(type==="event"){

        currentBanner={
            icon:"🎟️",
            title:"Event Access",
            text:"Scan for instant access."
        };

        banner.style.background=
        "linear-gradient(135deg,#1565c0,#42a5f5)";
    }


    icon.innerText=
    currentBanner.icon;

    title.innerText=
    currentBanner.title;

    text.innerText=
    currentBanner.text;

}


/* =====================================================
   CUSTOM IMAGE
===================================================== */

function setCustomImage(){

    const url =
    document
    .getElementById("customImage")
    .value
    .trim();


    if(!url){

        alert("Paste an image URL first.");

        return;
    }


    const banner =
    document.getElementById("banner");


    banner.innerHTML=
    `<img src="${url}"
          alt="Custom Scanner Image"
          onerror="alert('Could not load this image URL.')">`;

}


/* =====================================================
   UPLOAD
===================================================== */

async function uploadFile(){

    const fileInput =
    document.getElementById("fileInput");

    const file =
    fileInput.files[0];


    const status =
    document.getElementById("status");

    const button =
    document.getElementById("uploadButton");


    if(!file){

        status.innerText=
        "Please choose a file first.";

        return;
    }


    button.disabled=true;

    button.innerText=
    "Uploading...";


    status.innerText=
    "Uploading your file...";


    try{

        const uniqueName =
        Date.now() +
        "-" +
        Math.random()
        .toString(36)
        .substring(2) +
        "-" +
        file.name;


        const {data,error} =
        await supabaseClient
        .storage
        .from("uploads")
        .upload(
            uniqueName,
            file,
            {
                cacheControl:"3600",
                upsert:false,
                contentType:file.type
            }
        );


        if(error){

            throw error;
        }


        const {data:publicData} =
        supabaseClient
        .storage
        .from("uploads")
        .getPublicUrl(uniqueName);


        currentFileURL =
        publicData.publicUrl;


        createQR(currentFileURL);


        document
        .getElementById("result")
        .style.display="block";


        document
        .getElementById("resultFileName")
        .innerText=file.name;


        document
        .getElementById("fileLink")
        .value=currentFileURL;


        status.innerText=
        "✓ File uploaded successfully.";


    }

    catch(error){

        console.error(error);

        status.innerText=
        "Upload failed: "+
        error.message;

    }

    finally{

        button.disabled=false;

        button.innerText=
        "Upload & Generate QR";

    }

}


/* =====================================================
   QR
===================================================== */

function createQR(url){

    const qr =
    document.getElementById("qrcode");


    qr.innerHTML="";


    new QRCode(
        qr,
        {
            text:url,
            width:220,
            height:220,
            correctLevel:
            QRCode.CorrectLevel.H
        }
    );

}


/* =====================================================
   OPEN FILE
===================================================== */

function openFile(){

    if(!currentFileURL)return;

    window.open(
        currentFileURL,
        "_blank"
    );

}


/* =====================================================
   COPY LINK
===================================================== */

async function copyLink(){

    if(!currentFileURL)return;


    try{

        await navigator.clipboard
        .writeText(currentFileURL);

        alert("✓ Link copied!");

    }

    catch{

        alert(
        "Copy failed. Long press the link instead."
        );

    }

}


/* =====================================================
   SHARE
===================================================== */

async function shareScanner(){

    if(!currentFileURL)return;


    const shareData={

        title:"File Scanner",

        text:
        "Scan or open this file:",

        url:currentFileURL

    };


    if(
        navigator.share &&
        navigator.canShare &&
        navigator.canShare(shareData)
    ){

        try{

            await navigator.share(
                shareData
            );

        }

        catch(error){

            console.log(
                "Share cancelled."
            );

        }

    }

    else{

        await copyLink();

        alert(
        "Sharing isn't supported here. Link copied instead!"
        );

    }

}


/* =====================================================
   DOWNLOAD QR
===================================================== */

function downloadQR(){

    const qr =
    document.querySelector(
        "#qrcode img"
    );


    if(!qr){

        alert(
        "Generate a QR first."
        );

        return;
    }


    const link =
    document.createElement("a");


    link.href=qr.src;

    link.download=
    "file-scanner-QR.png";


    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);

}

</script>

</body>

</html>
