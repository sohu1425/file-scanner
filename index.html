<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>File Scanner</title>

<meta name="theme-color" content="#08090d">

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- QR Generator -->
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<!-- Poster Download -->
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

    min-height:100vh;

    color:white;

    background:
    radial-gradient(circle at 10% 0%,#25314d 0%,transparent 35%),
    radial-gradient(circle at 90% 100%,#15352d 0%,transparent 35%),
    #07080c;

    padding:20px 12px 40px;
}

.container{
    width:100%;
    max-width:720px;
    margin:auto;
}

/* HEADER */

.site-header{
    text-align:center;
    padding:15px 10px 25px;
}

.logo{
    width:72px;
    height:72px;

    margin:auto;

    border-radius:22px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:36px;

    background:
    linear-gradient(135deg,#ffffff,#bfc7ff);

    box-shadow:
    0 15px 45px rgba(120,130,255,.25);
}

.site-header h1{
    margin-top:15px;

    font-size:32px;

    letter-spacing:-1px;
}

.site-header p{
    margin-top:7px;

    color:#9ca3af;

    font-size:15px;
}

/* MAIN CARD */

.card{
    background:rgba(255,255,255,.055);

    border:1px solid rgba(255,255,255,.09);

    backdrop-filter:blur(25px);

    border-radius:28px;

    padding:22px;

    box-shadow:
    0 25px 80px rgba(0,0,0,.4);
}

/* BANNER */

.banner{
    width:100%;
    min-height:175px;

    border-radius:22px;

    overflow:hidden;

    position:relative;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    background:
    linear-gradient(135deg,#00695c,#26a69a);

    margin-bottom:20px;
}

.banner-overlay{
    position:absolute;

    inset:0;

    background:
    linear-gradient(
        rgba(0,0,0,.12),
        rgba(0,0,0,.25)
    );
}

.banner-content{
    position:relative;

    z-index:2;

    padding:25px;
}

.banner-icon{
    font-size:46px;
}

.banner-title{
    margin-top:7px;

    font-size:27px;

    font-weight:900;
}

.banner-subtitle{
    margin-top:6px;

    font-size:14px;

    color:#e8eeee;
}

/* CUSTOM IMAGE */

.banner-custom-image{
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    z-index:0;
}

.banner.has-image .banner-overlay{
    background:
    linear-gradient(
        rgba(0,0,0,.35),
        rgba(0,0,0,.55)
    );
}

/* FILE PICKER */

.file-picker{
    display:block;

    padding:30px 15px;

    border:2px dashed #3e4658;

    border-radius:20px;

    text-align:center;

    cursor:pointer;

    transition:.2s;
}

.file-picker:hover{
    border-color:#fff;

    background:rgba(255,255,255,.035);
}

.file-icon{
    font-size:42px;
}

.file-name{
    margin-top:10px;

    font-weight:800;

    word-break:break-word;
}

.file-help{
    margin-top:5px;

    color:#858da0;

    font-size:13px;
}

input[type=file]{
    display:none;
}

/* BUTTON */

.primary{
    width:100%;

    border:none;

    border-radius:16px;

    padding:17px;

    margin-top:15px;

    background:white;

    color:#08090d;

    font-size:16px;

    font-weight:900;

    cursor:pointer;

    transition:.2s;
}

.primary:hover{
    transform:translateY(-2px);

    box-shadow:
    0 12px 35px rgba(255,255,255,.16);
}

.primary:disabled{
    opacity:.5;

    transform:none;
}

/* BANNER CONTROLS */

.controls{
    margin-top:25px;

    padding-top:22px;

    border-top:1px solid rgba(255,255,255,.08);
}

.controls-title{
    font-size:14px;

    font-weight:800;

    margin-bottom:12px;
}

.banner-buttons{
    display:grid;

    grid-template-columns:
    repeat(4,1fr);

    gap:8px;
}

.banner-btn{
    border:1px solid #333a4a;

    background:#11141b;

    color:#ddd;

    padding:12px 5px;

    border-radius:13px;

    cursor:pointer;

    font-size:12px;

    font-weight:700;
}

.banner-btn:hover{
    border-color:white;
}

.custom-url{
    width:100%;

    margin-top:12px;

    padding:13px;

    border-radius:12px;

    outline:none;

    border:1px solid #333a4a;

    background:#11141b;

    color:white;
}

.custom-url:focus{
    border-color:white;
}

.small-button{
    width:100%;

    border:none;

    margin-top:8px;

    padding:13px;

    border-radius:12px;

    background:#242936;

    color:white;

    font-weight:800;

    cursor:pointer;
}

/* STATUS */

.status{
    min-height:22px;

    text-align:center;

    margin-top:15px;

    color:#aeb5c5;

    font-size:14px;
}

/* RESULT */

.result{
    display:none;

    margin-top:25px;

    text-align:center;
}

.result-title{
    font-size:20px;

    font-weight:900;
}

.result-file{
    margin-top:5px;

    color:#929aaa;

    font-size:13px;

    word-break:break-word;
}

.qr-preview{
    width:260px;
    height:260px;

    margin:22px auto;

    padding:18px;

    border-radius:22px;

    background:white;

    display:flex;

    align-items:center;
    justify-content:center;

    box-shadow:
    0 15px 45px rgba(0,0,0,.35);
}

#qrcode img{
    width:220px !important;
    height:220px !important;
}

/* ACTIONS */

.actions{
    display:grid;

    grid-template-columns:
    1fr 1fr;

    gap:9px;
}

.action{
    padding:14px;

    border-radius:14px;

    border:1px solid #303645;

    background:#171b24;

    color:white;

    font-weight:800;

    cursor:pointer;
}

.action:hover{
    background:#252b38;
}

.action-main{
    grid-column:1/-1;

    background:white;

    color:#08090d;

    border:none;
}

.file-link{
    margin-top:13px;

    display:flex;

    gap:7px;
}

.file-link input{
    flex:1;

    min-width:0;

    border:1px solid #303645;

    border-radius:11px;

    padding:11px;

    background:#0f1218;

    color:#999;

    font-size:11px;
}

.file-link button{
    border:none;

    border-radius:11px;

    padding:0 14px;

    background:#252a35;

    color:white;

    font-weight:700;
}

/* FOOTER */

.footer{
    text-align:center;

    color:#606878;

    font-size:12px;

    margin-top:20px;
}

/* MOBILE */

@media(max-width:500px){

    .card{
        padding:17px;

        border-radius:23px;
    }

    .site-header h1{
        font-size:28px;
    }

    .banner-buttons{
        grid-template-columns:
        repeat(2,1fr);
    }

    .qr-preview{
        width:245px;
        height:245px;
    }

}

</style>
</head>


<body>

<div class="container">


<header class="site-header">

    <div class="logo">
        📁
    </div>

    <h1>
        File Scanner
    </h1>

    <p>
        Upload anything • Generate a QR • Share instantly
    </p>

</header>


<main class="card">


<!-- ==================================================
     BANNER
================================================== -->

<div
    class="banner"
    id="banner">

    <div
        class="banner-overlay">
    </div>

    <div
        class="banner-content">

        <div
            class="banner-icon"
            id="bannerIcon">

            📶

        </div>

        <div
            class="banner-title"
            id="bannerTitle">

            FREE Wi-Fi

        </div>

        <div
            class="banner-subtitle"
            id="bannerSubtitle">

            Scan to connect instantly

        </div>

    </div>

</div>


<!-- ==================================================
     FILE
================================================== -->

<label
    class="file-picker"
    for="fileInput">

    <div class="file-icon">
        📤
    </div>

    <div
        class="file-name"
        id="selectedFileName">

        Choose your file

    </div>

    <div class="file-help">

        Photos • PDFs • Videos • Documents • Anything

    </div>

</label>


<input
    type="file"
    id="fileInput"
>


<button
    class="primary"
    id="uploadButton"
    onclick="uploadFile()">

    Upload & Generate QR

</button>


<div
    class="status"
    id="status">
</div>


<!-- ==================================================
     HEADER OPTIONS
================================================== -->

<section class="controls">

    <div class="controls-title">

        🎨 Choose Scanner Header

    </div>


    <div class="banner-buttons">

        <button
            class="banner-btn"
            onclick="setBanner('wifi')">

            📶<br>
            Free Wi-Fi

        </button>


        <button
            class="banner-btn"
            onclick="setBanner('menu')">

            🍽️<br>
            Menu

        </button>


        <button
            class="banner-btn"
            onclick="setBanner('offer')">

            🎁<br>
            Offer

        </button>


        <button
            class="banner-btn"
            onclick="setBanner('event')">

            🎟️<br>
            Event

        </button>

    </div>


    <input
        class="custom-url"
        id="customImageUrl"
        placeholder="Paste custom header image URL"
    >


    <button
        class="small-button"
        onclick="applyCustomImage()">

        🖼️ Use Custom Header Image

    </button>

</section>


<!-- ==================================================
     RESULT
================================================== -->

<section
    class="result"
    id="result">

    <div class="result-title">

        ✓ QR Ready

    </div>

    <div
        class="result-file"
        id="resultFile">
    </div>


    <div class="qr-preview">

        <div id="qrcode"></div>

    </div>


    <div class="actions">

        <button
            class="action action-main"
            onclick="openFile()">

            📂 Open File

        </button>


        <button
            class="action"
            onclick="shareScanner()">

            📤 Share Scanner

        </button>


        <button
            class="action"
            onclick="downloadPoster()">

            🖼️ Download Full Poster

        </button>


        <button
            class="action"
            onclick="copyLink()">

            🔗 Copy Link

        </button>


        <button
            class="action"
            onclick="downloadQR()">

            ⬇️ QR Only

        </button>

    </div>


    <div class="file-link">

        <input
            id="generatedLink"
            readonly
        >

        <button
            onclick="copyLink()">

            Copy

        </button>

    </div>

</section>


</main>


<div class="footer">

    File Scanner • Fast • Simple • Shareable

</div>


</div>



<!-- ==================================================
     SCRIPT
================================================== -->

<script>


/* ==================================================
   SUPABASE
================================================== */

const SUPABASE_URL =
"https://ljyuhpgwjlgcbpgnmdui.supabase.co";


const SUPABASE_KEY =
"sb_publishable_RH86rGQggXgBJ_rokiypdA_8q4UGyk3";


const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* ==================================================
   VARIABLES
================================================== */

let currentFileURL = "";

let currentFileName = "";


/* ==================================================
   BANNER DATA
================================================== */

const banners = {

    wifi:{
        icon:"📶",
        title:"FREE Wi-Fi",
        subtitle:"Scan to connect instantly",
        background:
        "linear-gradient(135deg,#00695c,#26a69a)"
    },

    menu:{
        icon:"🍽️",
        title:"DIGITAL MENU",
        subtitle:"Scan to view our menu",
        background:
        "linear-gradient(135deg,#6a1b9a,#ab47bc)"
    },

    offer:{
        icon:"🎁",
        title:"SPECIAL OFFER",
        subtitle:"Scan to unlock this offer",
        background:
        "linear-gradient(135deg,#c62828,#ef5350)"
    },

    event:{
        icon:"🎟️",
        title:"EVENT ACCESS",
        subtitle:"Scan for instant access",
        background:
        "linear-gradient(135deg,#1565c0,#42a5f5)"
    }

};


/* ==================================================
   FILE SELECT
================================================== */

document
.getElementById("fileInput")
.addEventListener(
    "change",
    function(){

        const file =
        this.files[0];

        if(!file){
            return;
        }

        currentFileName =
        file.name;

        document
        .getElementById(
            "selectedFileName"
        )
        .innerText =
        file.name;

    }
);


/* ==================================================
   SET BANNER
================================================== */

function setBanner(type){

    const data =
    banners[type];

    const banner =
    document.getElementById("banner");

    banner.classList.remove(
        "has-image"
    );

    const oldImage =
    banner.querySelector(
        ".banner-custom-image"
    );

    if(oldImage){
        oldImage.remove();
    }


    banner.style.background =
    data.background;


    document
    .getElementById("bannerIcon")
    .innerText =
    data.icon;


    document
    .getElementById("bannerTitle")
    .innerText =
    data.title;


    document
    .getElementById("bannerSubtitle")
    .innerText =
    data.subtitle;

}


/* ==================================================
   CUSTOM IMAGE
================================================== */

function applyCustomImage(){

    const url =
    document
    .getElementById(
        "customImageUrl"
    )
    .value
    .trim();


    if(!url){

        alert(
            "Paste an image URL first."
        );

        return;
    }


    const banner =
    document.getElementById(
        "banner"
    );


    const oldImage =
    banner.querySelector(
        ".banner-custom-image"
    );


    if(oldImage){
        oldImage.remove();
    }


    const image =
    document.createElement("img");


    image.src = url;

    image.className =
    "banner-custom-image";


    image.crossOrigin =
    "anonymous";


    image.onload =
    function(){

        banner.classList.add(
            "has-image"
        );

    };


    image.onerror =
    function(){

        alert(
            "This image URL could not be loaded."
        );

        image.remove();

    };


    banner.prepend(image);

}


/* ==================================================
   UPLOAD
================================================== */

async function uploadFile(){

    const input =
    document.getElementById(
        "fileInput"
    );


    const file =
    input.files[0];


    const status =
    document.getElementById(
        "status"
    );


    const button =
    document.getElementById(
        "uploadButton"
    );


    if(!file){

        status.innerText =
        "Please choose a file first.";

        return;
    }


    button.disabled =
    true;

    button.innerText =
    "Uploading...";


    status.innerText =
    "Uploading your file...";


    try{


        const safeName =
        file.name
        .replace(
            /[^a-zA-Z0-9._-]/g,
            "_"
        );


        const uniqueName =
        Date.now()
        + "-"
        + Math.random()
        .toString(36)
        .substring(2)
        + "-"
        + safeName;


        const result =
        await supabaseClient
        .storage
        .from("uploads")
        .upload(
            uniqueName,
            file,
            {
                cacheControl:"3600",

                upsert:false,

                contentType:
                file.type
            }
        );


        if(result.error){

            throw result.error;

        }


        const publicResult =
        supabaseClient
        .storage
        .from("uploads")
        .getPublicUrl(
            uniqueName
        );


        currentFileURL =
        publicResult
        .data
        .publicUrl;


        currentFileName =
        file.name;


        createQR(
            currentFileURL
        );


        document
        .getElementById(
            "result"
        )
        .style.display =
        "block";


        document
        .getElementById(
            "resultFile"
        )
        .innerText =
        currentFileName;


        document
        .getElementById(
            "generatedLink"
        )
        .value =
        currentFileURL;


        status.innerText =
        "✓ File uploaded successfully.";


        document
        .getElementById(
            "result"
        )
        .scrollIntoView({
            behavior:"smooth"
        });


    }
    catch(error){

        console.error(error);

        status.innerText =
        "Upload failed: "
        + error.message;

    }
    finally{

        button.disabled =
        false;

        button.innerText =
        "Upload & Generate QR";

    }

}


/* ==================================================
   CREATE QR
================================================== */

function createQR(url){

    const box =
    document.getElementById(
        "qrcode"
    );


    box.innerHTML =
    "";


    new QRCode(
        box,
        {
            text:url,

            width:220,

            height:220,

            correctLevel:
            QRCode.CorrectLevel.H
        }
    );

}


/* ==================================================
   OPEN FILE
================================================== */

function openFile(){

    if(!currentFileURL){
        return;
    }


    window.location.href =
    currentFileURL;

}


/* ==================================================
   COPY
================================================== */

async function copyLink(){

    if(!currentFileURL){
        return;
    }


    try{

        await navigator
        .clipboard
        .writeText(
            currentFileURL
        );


        alert(
            "✓ File link copied!"
        );

    }
    catch(error){

        alert(
            "Copy failed."
        );

    }

}


/* ==================================================
   SHARE SCANNER
================================================== */

async function shareScanner(){

    if(!currentFileURL){
        return;
    }


    const shareData = {

        title:
        currentFileName ||
        "File Scanner",

        text:
        "Open this file:",

        url:
        currentFileURL

    };


    if(
        navigator.share
    ){

        try{

            await navigator.share(
                shareData
            );

        }
        catch(error){

            console.log(
                "Share cancelled."
            );

        }

    }
    else{

        await copyLink();

        alert(
            "Share isn't supported here. The link was copied."
        );

    }

}


/* ==================================================
   DOWNLOAD QR ONLY
================================================== */

function downloadQR(){

    const qrImage =
    document.querySelector(
        "#qrcode img"
    );


    if(!qrImage){

        alert(
            "Generate a QR first."
        );

        return;
    }


    const link =
    document.createElement("a");


    link.href =
    qrImage.src;


    link.download =
    "File-Scanner-QR.png";


    document.body.appendChild(
        link
    );


    link.click();


    link.remove();

}


/* ==================================================
   DOWNLOAD FULL POSTER
================================================== */

async function downloadPoster(){

    if(!currentFileURL){

        alert("Generate a QR first.");

        return;
    }


    /* CREATE MINIMAL QR POSTER */

    const poster =
        document.createElement("div");


    poster.style.position =
        "fixed";

    poster.style.left =
        "-10000px";

    poster.style.top =
        "0";


    poster.style.width =
        "700px";


    poster.style.background =
        "#ffffff";


    poster.style.color =
        "#111111";


    poster.style.padding =
        "45px 40px";


    poster.style.fontFamily =
        "Arial, sans-serif";


    poster.style.textAlign =
        "center";


    /* HEADER */

    const header =
        document.createElement("div");


    header.innerText =
        document.getElementById(
            "bannerTitle"
        ).innerText;


    header.style.fontSize =
        "34px";


    header.style.fontWeight =
        "900";


    header.style.marginBottom =
        "28px";


    poster.appendChild(
        header
    );


    /* SCAN TO OPEN */

    const scanText =
        document.createElement("div");


    scanText.innerText =
        "SCAN TO OPEN";


    scanText.style.fontSize =
        "28px";


    scanText.style.fontWeight =
        "900";


    scanText.style.letterSpacing =
        "2px";


    scanText.style.marginBottom =
        "25px";


    poster.appendChild(
        scanText
    );


    /* QR CODE */

    const qrContainer =
        document.createElement("div");


    qrContainer.style.display =
        "flex";


    qrContainer.style.justifyContent =
        "center";


    qrContainer.style.alignItems =
        "center";


    const qrSource =
        document.querySelector(
            "#qrcode img"
        );


    if(!qrSource){

        alert(
            "QR code not found. Generate a QR first."
        );

        poster.remove();

        return;
    }


    const qrImage =
        document.createElement("img");


    qrImage.src =
        qrSource.src;


    qrImage.style.width =
        "360px";


    qrImage.style.height =
        "360px";


    qrContainer.appendChild(
        qrImage
    );


    poster.appendChild(
        qrContainer
    );


    document.body.appendChild(
        poster
    );


    try{

        const canvas =
            await html2canvas(
                poster,
                {
                    scale:2,

                    backgroundColor:
                        "#ffffff"
                }
            );


        const link =
            document.createElement("a");


        link.download =
            "QR-Scanner-Poster.png";


        link.href =
            canvas.toDataURL(
                "image/png"
            );


        document.body.appendChild(
            link
        );


        link.click();


        link.remove();


    }
    catch(error){

        console.error(error);

        alert(
            "Could not download poster."
        );

    }


    poster.remove();

}
   

</script>

</body>
</html>
